http_port 3128

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

acl private_ipv4 dst 0.0.0.0/8
acl private_ipv4 dst 10.0.0.0/8
acl private_ipv4 dst 100.64.0.0/10
acl private_ipv4 dst 127.0.0.0/8
acl private_ipv4 dst 169.254.0.0/16
acl private_ipv4 dst 172.16.0.0/12
acl private_ipv4 dst 192.168.0.0/16
acl private_ipv4 dst 224.0.0.0/4
acl private_ipv4 dst 240.0.0.0/4
acl private_ipv6 dst ::1/128
acl private_ipv6 dst fc00::/7
acl private_ipv6 dst fe80::/10

acl allowed_domains dstdomain .openai.com
acl allowed_domains dstdomain .chatgpt.com
acl allowed_domains dstdomain .oaistatic.com
acl allowed_domains dstdomain .oaiusercontent.com
acl allowed_domains dstdomain .github.com
acl allowed_domains dstdomain .githubusercontent.com
acl allowed_domains dstdomain .githubassets.com
acl allowed_domains dstdomain ghcr.io
acl allowed_domains dstdomain .npmjs.org
acl allowed_domains dstdomain fcm.googleapis.com
acl allowed_domains dstdomain .push.apple.com
acl allowed_domains dstdomain .push.services.mozilla.com
acl allowed_domains dstdomain .notify.windows.com
acl allowed_domains dstdomain .pypi.org
acl allowed_domains dstdomain .pythonhosted.org
acl allowed_domains dstdomain ha-mcp.example.com
acl allowed_domains dstdomain auth.example.com
acl allowed_domains dstdomain office.example.com

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny private_ipv4
http_access deny private_ipv6
http_access allow allowed_domains
http_access deny all

cache deny all
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
reply_header_access Via deny all

access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
cache_store_log none
coredump_dir /tmp
