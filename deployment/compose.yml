services:
  mergeron-ui:
    image: ${MERGERON_APP_IMAGE:-ghcr.io/maxhugit/mergeron:latest}
    container_name: ${MERGERON_STACK_PREFIX:-mergeron}-ui
    restart: unless-stopped
    labels:
      io.mergeron.managed: 'true'
      io.mergeron.stack: ${MERGERON_STACK_PREFIX:-mergeron}
      io.mergeron.component: application
    init: true
    user: '11002:11002'
    working_dir: /app
    entrypoint:
      - sh
      - -c
    command:
      - export WEBUI_API_KEY="$$(cat /run/secrets/backend_token)"; exec /usr/local/bin/entrypoint.sh node /app/dist/main.js
    environment:
      NODE_ENV: production
      PORT: '8172'
      HOME: /home/codex
      CODEX_HOME: /home/codex/.codex
      MERGERON_PUBLISHED_DOCUMENT_PROTECTION: required
      WEBUI_DB_PATH: /home/codex/.codex/codex-webui.sqlite
      WEBUI_REQUIRE_IDENTITY: 'true'
      MERGERON_PUBLIC_URL: ${MERGERON_WEBUI_URL:-https://mergeron.example.com}
      MERGERON_STACK_ENVIRONMENT: ${MERGERON_STACK_ENVIRONMENT:-production}
      MERGERON_MANAGER_SOCKET: /run/mergeron-manager/manager.sock
      MERGERON_PREVIEWS_ENABLED: ${MERGERON_PREVIEWS_ENABLED:-false}
      MERGERON_PREVIEW_DOMAIN: ${MERGERON_PREVIEW_DOMAIN:-preview.invalid}
      WEBUI_PROTECTED_PATHS: /home/codex,/run/secrets,/app,/proc,/sys,/dev,/etc,/root,/appdata/mergeron
      WORKSPACE_ROOTS: /workspaces,/appdata
      LOG_LEVEL: info
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      OPENAI_CHAT_MODEL: gpt-5-mini
      HTTP_PROXY: http://mergeron-squid:3128
      HTTPS_PROXY: http://mergeron-squid:3128
      ALL_PROXY: http://mergeron-squid:3128
      NO_PROXY: 127.0.0.1,localhost,mergeron-ui
      http_proxy: http://mergeron-squid:3128
      https_proxy: http://mergeron-squid:3128
      all_proxy: http://mergeron-squid:3128
      no_proxy: 127.0.0.1,localhost,mergeron-ui
      TZ: Europe/Paris
    volumes:
      - ${STATE_ROOT}/home:/home/codex
      - ${STATE_ROOT}/workspace:/workspaces
      - ${MERGERON_APPDATA_ROOT:-${STATE_ROOT}/appdata}:/appdata
      - ${STATE_ROOT}/logs:/app/logs
      - ${STATE_ROOT}/backend-token.txt:/run/secrets/backend_token:ro
      - ${STATE_ROOT}/openai-api-key.txt:/run/secrets/openai_api_key:ro
      - ${STATE_ROOT}/ssh:/home/codex/.ssh:ro
      - ${STATE_ROOT}/manager-run:/run/mergeron-manager
    networks:
      mergeron-isolated:
        aliases: [mergeron-ui, mergeron]
      mergeron-admin:
        aliases: [mergeron-ui, mergeron]
    group_add:
      - '11001'
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=${DEPLOY_ROOT}/config/seccomp-bwrap.json
      # Bubblewrap creates a fresh, isolated /proc inside its user namespace.
      # Docker's default masked system paths make that mount "too revealing"
      # and the kernel rejects it before the Codex sandbox can start.
      - systempaths=unconfined
    pids_limit: 1024
    mem_limit: 8g
    cpus: 3.5
    stop_grace_period: 30m
    depends_on:
      mergeron-squid:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'token=$$(cat /run/secrets/backend_token) && curl -fsS -H "Authorization: Bearer $$token" http://127.0.0.1:8172/api/status >/dev/null',
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

  mergeron-ingress:
    image: ${MERGERON_INGRESS_IMAGE:-nginx:stable}
    container_name: ${MERGERON_STACK_PREFIX:-mergeron}-ingress
    restart: unless-stopped
    environment:
      MERGERON_PREVIEW_DOMAIN: ${MERGERON_PREVIEW_DOMAIN:-preview.invalid}
    labels:
      io.mergeron.managed: 'true'
      io.mergeron.stack: ${MERGERON_STACK_PREFIX:-mergeron}
      io.mergeron.component: ingress
    depends_on:
      mergeron-ui:
        condition: service_healthy
    command:
      - sh
      - -c
      - export MERGERON_BACKEND_TOKEN="$$(cat /run/secrets/backend_token)"; envsubst '$${MERGERON_BACKEND_TOKEN} $${MERGERON_PREVIEW_DOMAIN}' < /etc/nginx/templates-secure/nginx.conf.template > /tmp/nginx.conf; exec nginx -c /tmp/nginx.conf -g 'daemon off;'
    volumes:
      - ${DEPLOY_ROOT}/config/${MERGERON_NGINX_TEMPLATE:?Set MERGERON_NGINX_TEMPLATE explicitly for the chosen authentication mode}:/etc/nginx/templates-secure/nginx.conf.template:ro
      - ${STATE_ROOT}/backend-token-nginx.txt:/run/secrets/backend_token:ro
    networks:
      mergeron-isolated:
        aliases: [mergeron-ingress]
      proxy:
        aliases: [mergeron-ingress]
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,size=32m
      - /var/run:rw,nosuid,nodev,size=4m
      - /tmp:rw,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ['CMD', 'nginx', '-t', '-c', '/tmp/nginx.conf']
      interval: 20s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  mergeron-squid:
    image: ${MERGERON_EGRESS_IMAGE:-ubuntu/squid:latest}
    container_name: ${MERGERON_STACK_PREFIX:-mergeron}-squid
    restart: unless-stopped
    labels:
      io.mergeron.managed: 'true'
      io.mergeron.stack: ${MERGERON_STACK_PREFIX:-mergeron}
      io.mergeron.component: egress
    volumes:
      - ${DEPLOY_ROOT}/config/squid.conf:/etc/squid/squid.conf:ro
    networks:
      mergeron-isolated:
        aliases: [mergeron-squid]
      mergeron-external:
        aliases: [mergeron-squid]
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/log/squid:rw,nosuid,nodev,size=32m,mode=1777
      - /var/spool/squid:rw,nosuid,nodev,size=32m
      - /run:rw,nosuid,nodev,size=4m
      - /tmp:rw,nosuid,nodev,size=16m
    pids_limit: 256
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ['CMD', '/usr/bin/pidof', 'squid']
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  mergeron-manager:
    image: ${MERGERON_MANAGER_IMAGE:-ghcr.io/maxhugit/mergeron-manager:edge}
    container_name: ${MERGERON_STACK_PREFIX:-mergeron}-manager
    restart: unless-stopped
    labels:
      io.mergeron.stack: ${MERGERON_STACK_PREFIX:-mergeron}
      io.mergeron.component: manager
    environment:
      MERGERON_STACK_PREFIX: ${MERGERON_STACK_PREFIX:-mergeron}
      MERGERON_PREVIEWS_ENABLED: ${MERGERON_PREVIEWS_ENABLED:-false}
      MERGERON_PREVIEW_DOMAIN: ${MERGERON_PREVIEW_DOMAIN:-preview.invalid}
      MERGERON_PREVIEW_IMAGES: ${MERGERON_PREVIEW_IMAGES:-}
      MERGERON_STACK_ENVIRONMENT: ${MERGERON_STACK_ENVIRONMENT:-production}
      MERGERON_MANAGE_BROWSER: ${MERGERON_MANAGE_BROWSER:-false}
      MERGERON_APP_CATALOG_BYPARR_ENABLED: ${MERGERON_APP_CATALOG_BYPARR_ENABLED:-false}
      MERGERON_PROXY_NETWORK: ${MERGERON_PROXY_NETWORK:-mergeron-proxy}
      MERGERON_AUTH_MODE: ${MERGERON_AUTH_MODE:-native}
      MERGERON_MANAGER_SOCKET: /run/mergeron-manager/manager.sock
      MERGERON_MANAGER_SOCKET_GID: '11002'
      MERGERON_MANAGER_POLL_MS: '20000'
      MERGERON_DOCKER_SOCKET: /var/run/docker.sock
      MERGERON_MANAGER_ADOPTION_PATH: /var/lib/mergeron-manager/adoption.json
      MERGERON_INSTALL_ENABLED: ${MERGERON_INSTALL_ENABLED:-false}
      MERGERON_STATE_ROOT: ${STATE_ROOT}
      MERGERON_MANAGER_HOST_STATE: /host-state
      MERGERON_APPDATA_ROOT: ${MERGERON_APPDATA_ROOT:-${STATE_ROOT}/appdata}
      MERGERON_ADMIN_SUBNET: ${MERGERON_ADMIN_SUBNET:-172.30.44.0/28}
      MERGERON_WEBUI_URL: ${MERGERON_WEBUI_URL:-https://mergeron.example.com}
      MERGERON_ICON_URL: ${MERGERON_ICON_URL:-}
      MERGERON_APP_IMAGE: ${MERGERON_APP_IMAGE:-ghcr.io/maxhugit/mergeron:latest}
      MERGERON_INGRESS_IMAGE: ${MERGERON_INGRESS_IMAGE:-nginx:stable}
      MERGERON_EGRESS_IMAGE: ${MERGERON_EGRESS_IMAGE:-ubuntu/squid:latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${STATE_ROOT}:/host-state
      - ${STATE_ROOT}/manager-run:/run/mergeron-manager
      - ${STATE_ROOT}/manager-state:/var/lib/mergeron-manager
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=8m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 0.25
    healthcheck:
      test: ['CMD', '/nodejs/bin/node', 'src/healthcheck.mjs']
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  mergeron-isolated:
    name: ${MERGERON_STACK_PREFIX:-mergeron}-isolated
    internal: true
    driver: bridge
  mergeron-external:
    name: ${MERGERON_STACK_PREFIX:-mergeron}-external
    driver: bridge
  mergeron-admin:
    name: ${MERGERON_STACK_PREFIX:-mergeron}-admin
    driver: bridge
    ipam:
      config:
        - subnet: ${MERGERON_ADMIN_SUBNET:-172.30.44.0/28}
  proxy:
    external: true
    name: ${MERGERON_PROXY_NETWORK:-mergeron-proxy}
