http:
  middlewares:
    mergeron-security-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: "no-referrer"
        stsSeconds: 31536000
        stsIncludeSubdomains: true

  routers:
    # OnlyOffice Document Server cannot complete an interactive Authentik
    # login. These two machine-to-machine endpoints remain protected by the
    # Mergeron ingress credential plus the signed OnlyOffice callback JWT/state.
    mergeron-onlyoffice:
      rule: "Host(`mergeron.example.com`) && (Path(`/api/files/serve`) || Path(`/api/onlyoffice/callback`))"
      entryPoints:
        - websecure
      priority: 200
      middlewares:
        - mergeron-security-headers
      service: mergeron-web
      tls:
        certResolver: tls

    # Nginx already enforces Authentik and serves its browser login endpoints.
    # A second forwardAuth middleware here can intercept session renewal.
    mergeron-web:
      rule: "Host(`mergeron.example.com`)"
      entryPoints:
        - websecure
      priority: 100
      middlewares:
        - mergeron-security-headers
      service: mergeron-web
      tls:
        certResolver: tls

  services:
    mergeron-web:
      loadBalancer:
        servers:
          - url: "http://mergeron-ingress:8080"
