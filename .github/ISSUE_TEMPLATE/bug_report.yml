name: Signaler un bug
description: Signaler un défaut de Mergeron ou du déploiement Docker
title: '[Bug] '
labels: ['bug']
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Vérifications préalables
      options:
        - label: J’ai vérifié qu’aucune issue existante ne décrit déjà ce problème.
          required: true
        - label: J’ai retiré les clés, jetons, adresses privées et chemins personnels.
          required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Tag Docker ou SHA Git utilisé.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Zone concernée
      options:
        - Interface et conversations
        - Fichiers et OnlyOffice
        - Terminal et espaces de travail
        - MCP et intégrations
        - Authentification et accès public
        - Docker, réseaux ou déploiement
        - Autre
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Résultat observé
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Journaux ou captures nettoyés
      description: Vérifier le contenu avant de joindre un export de diagnostic.
