name: Build and publish Mergeron images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: mergeron-${{ github.ref }}
  # Never interrupt the app/Manager promotion pair with a newer main commit.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Publish under the canonical repository name: ghcr.io/maxhugit/mergeron.
  IMAGE_NAME: ${{ github.repository }}
  MANAGER_IMAGE_NAME: maxhugit/mergeron-manager

jobs:
  browser-publish:
    # The browser is independent; publish only after the complete source checks.
    needs: [quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/maxhugit/mergeron-browser
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: ./deployment/browser
          platforms: linux/amd64
          push: true
          tags: ghcr.io/maxhugit/mergeron-browser:candidate-${{ github.sha }}
          build-args: MERGERON_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Scan browser candidate before publishing moving tags
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/maxhugit/mergeron-browser@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Promote verified browser image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "ghcr.io/maxhugit/mergeron-browser@$DIGEST"

  quality:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/quality.yml
    with:
      validate_image: false

  build:
    # Build concurrently; promotion still requires all source checks.
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      candidate: ${{ steps.candidate.outputs.tags }}
      tags: ${{ steps.meta.outputs.tags }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Mergeron build identity
        id: release-version
        run: node scripts/release-version.mjs "${GITHUB_REF_NAME}"

      - name: Vérifier l'absence de contenu chinois
        run: python3 scripts/check-no-chinese.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Candidate Docker metadata
        id: candidate
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=sha,prefix=sha-

      - name: Release Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ steps.release-version.outputs.is_release }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push immutable candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.candidate.outputs.tags }}
          build-args: |
            MERGERON_VERSION=${{ steps.release-version.outputs.version }}
            MERGERON_REVISION=${{ github.sha }}
            MERGERON_BUILD_DATE=${{ steps.release-version.outputs.created }}
            MERGERON_RELEASE_CHANNEL=${{ steps.release-version.outputs.channel }}
          labels: |
            org.opencontainers.image.title=Mergeron
            org.opencontainers.image.description=Plateforme collaborative auto-hébergée de gestion de projets et d'agents
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.version=${{ steps.release-version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.release-version.outputs.created }}
          # A registry cache avoids the very slow GitHub cache export observed
          # on large toolchain layers while retaining intermediate build stages.
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
            type=gha
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true
          provenance: mode=max
          sbom: true

      - name: Verify embedded build identity
        env:
          IMAGE_REF: ${{ steps.candidate.outputs.tags }}
          MERGERON_VERSION: ${{ steps.release-version.outputs.version }}
          MERGERON_CHANNEL: ${{ steps.release-version.outputs.channel }}
          MERGERON_BUILD_DATE: ${{ steps.release-version.outputs.created }}
        run: scripts/verify-build-info-image.sh "$IMAGE_REF" "$MERGERON_VERSION" "$GITHUB_SHA" "$MERGERON_BUILD_DATE" "$MERGERON_CHANNEL"

      - name: Verify published document isolation on the immutable candidate
        env:
          IMAGE_REF: ${{ steps.candidate.outputs.tags }}
        run: bash scripts/smoke-test-document-isolation.sh "$IMAGE_REF"

      - name: Verify header package and native compilation
        env:
          IMAGE_REF: ${{ steps.candidate.outputs.tags }}
        run: scripts/verify-linux-headers-image.sh "$IMAGE_REF" > linux-header-evidence.json

      - name: Scan candidate for HIGH and CRITICAL vulnerabilities (JSON)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ steps.candidate.outputs.tags }}
          format: json
          output: trivy-results.raw.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'

      - name: Apply reviewed header applicability statements
        env:
          IMAGE_REF: ${{ steps.candidate.outputs.tags }}
        run: |
          trivy image --cache-dir .cache/trivy --skip-db-update --scanners vuln --severity HIGH,CRITICAL --vex security/linux-libc-dev.openvex.json --format json --output trivy-results.headers.json "$IMAGE_REF"
          python3 scripts/audit-linux-header-vex.py trivy-results.raw.json trivy-results.headers.json security/linux-libc-dev.openvex.json

      - name: Verify absent system implementations and retained client features
        env:
          IMAGE_REF: ${{ steps.candidate.outputs.tags }}
        run: |
          scripts/verify-system-components-image.sh "$IMAGE_REF" > system-component-evidence.json
          python3 scripts/audit-system-component-vex.py prepare system-component-evidence.json image.openvex.json
          trivy image --cache-dir .cache/trivy --skip-db-update --scanners vuln --severity HIGH,CRITICAL --vex image.openvex.json --format json --output trivy-results.json "$IMAGE_REF"
          python3 scripts/audit-system-component-vex.py audit system-component-evidence.json trivy-results.headers.json trivy-results.json

      - name: Test real SSH and Git transfers against an isolated server
        env:
          IMAGE_REF: ${{ steps.candidate.outputs.tags }}
        run: |
          docker buildx build --file Dockerfile --target ssh-test-server --cache-from type=registry,ref=ghcr.io/maxhugit/mergeron:buildcache --load --tag webui-ssh-fixture .
          scripts/smoke-test-ssh-image.sh "$IMAGE_REF" webui-ssh-fixture > ssh-client-evidence.json

      - name: Verify patched libxml2 and real Office conversions
        env:
          IMAGE_REF: ${{ steps.candidate.outputs.tags }}
        run: |
          scripts/smoke-test-office-image.sh "$IMAGE_REF" > office-xml-evidence.json
          python3 scripts/audit-libxml2-backport.py trivy-results.raw.json office-xml-evidence.json

      - name: Verify corrected OpenSSH sources and retain raw scan findings
        run: python3 scripts/audit-openssh-backport.py trivy-results.raw.json ssh-client-evidence.json

      - name: Convert the reviewed JSON report to SARIF
        run: trivy convert --format sarif --output trivy-results.sarif trivy-results.json

      - name: Publish Trivy results to GitHub code scanning
        uses: github/codeql-action/upload-sarif@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      - name: Upload Trivy JSON report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-container-report-${{ github.sha }}
          path: |
            trivy-results.json
            trivy-results.raw.json
            trivy-results.headers.json
            office-xml-evidence.json
            security/libxml2-patches/manifest.json
            ssh-client-evidence.json
            system-component-evidence.json
            image.openvex.json
            security/system-components.openvex.json
            security/system-components-assessment.json
            linux-header-evidence.json
            security/linux-libc-dev.openvex.json
            security/linux-libc-dev-assessment.csv
          if-no-files-found: error
          retention-days: 30

      - name: Add Trivy summary
        id: trivy-summary
        shell: bash
        run: |
          critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json)"
          high="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json)"
          fixable_critical="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" and (.FixedVersion // "") != "")] | length' trivy-results.json)"

          {
            echo "## Analyse de sécurité Trivy"
            echo
            echo "| Sévérité | Total | Critiques corrigibles |"
            echo "| --- | ---: | ---: |"
            echo "| CRITICAL | ${critical} | ${fixable_critical} |"
            echo "| HIGH | ${high} | — |"
            echo
            echo "Le rapport JSON complet est disponible dans l’artefact \`trivy-container-report-${GITHUB_SHA}\`."

            if (( critical + high > 0 )); then
              echo
              echo "### Premières vulnérabilités détectées"
              echo
              echo "| Sévérité | Paquet | Version installée | Version corrigée | Vulnérabilité |"
              echo "| --- | --- | --- | --- | --- |"
              jq -r '
                [.Results[]?.Vulnerabilities[]?]
                | sort_by(if .Severity == "CRITICAL" then 0 else 1 end)
                | .[:20][]
                | "| \(.Severity) | `\(.PkgName)` | `\(.InstalledVersion)` | `\(.FixedVersion // "—")` | \(.VulnerabilityID) |"
              ' trivy-results.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "fixable_critical=${fixable_critical}" >> "$GITHUB_OUTPUT"

      - name: Block release on fixable critical vulnerabilities
        if: steps.trivy-summary.outputs.fixable_critical != '0'
        env:
          FIXABLE_CRITICAL: ${{ steps.trivy-summary.outputs.fixable_critical }}
        run: |
          echo "::error title=Fixable critical vulnerabilities::Trivy found ${FIXABLE_CRITICAL} fixable CRITICAL vulnerabilities."
          exit 1

      - name: Start candidate and wait for its health check
        env:
          IMAGE_REF: ${{ steps.candidate.outputs.tags }}
        run: scripts/smoke-test-image.sh "$IMAGE_REF"

  manager-build:
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      candidate: ${{ steps.candidate.outputs.tags }}
      tags: ${{ steps.meta.outputs.tags }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Mergeron build identity
        id: release-version
        run: node scripts/release-version.mjs "${GITHUB_REF_NAME}"

      - name: Test the observe-only manager
        run: node --test manager/test/*.test.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Candidate Docker metadata
        id: candidate
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.MANAGER_IMAGE_NAME }}
          tags: type=sha,prefix=sha-

      - name: Release Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.MANAGER_IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ steps.release-version.outputs.is_release }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push immutable manager candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.manager
          platforms: linux/amd64
          push: true
          tags: ${{ steps.candidate.outputs.tags }}
          build-args: |
            MERGERON_VERSION=${{ steps.release-version.outputs.version }}
            MERGERON_REVISION=${{ github.sha }}
            MERGERON_BUILD_DATE=${{ steps.release-version.outputs.created }}
            MERGERON_RELEASE_CHANNEL=${{ steps.release-version.outputs.channel }}
          provenance: mode=max
          sbom: true

      - name: Scan manager for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ steps.candidate.outputs.tags }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: Start manager and verify its Unix socket health check
        env:
          IMAGE_REF: ${{ steps.candidate.outputs.tags }}
        run: |
          mkdir -p "$RUNNER_TEMP/mergeron-manager-run"
          sudo chown 0:0 "$RUNNER_TEMP/mergeron-manager-run"
          bash scripts/smoke-test-manager-secrets.sh "$IMAGE_REF"
          bash scripts/smoke-test-manager-backup.sh "$IMAGE_REF"
          container_id="$(docker run -d --read-only --network none --cap-drop ALL --cap-add CHOWN --cap-add DAC_READ_SEARCH --security-opt no-new-privileges:true --tmpfs /tmp:rw,nosuid,nodev,size=8m -v /var/run/docker.sock:/var/run/docker.sock:ro -v "$RUNNER_TEMP/mergeron-manager-run:/run/mergeron-manager" "$IMAGE_REF")"
          trap 'docker logs "$container_id"; docker rm -f "$container_id" >/dev/null' EXIT
          for attempt in $(seq 1 20); do
            if docker exec "$container_id" /nodejs/bin/node src/healthcheck.mjs; then
              exit 0
            fi
            sleep 1
          done
          exit 1

  promote:
    needs: [quality, build, manager-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the verified app and Manager pair with rollback
        env:
          APP_SOURCE_IMAGE: ${{ needs.build.outputs.candidate }}
          APP_SOURCE_DIGEST: ${{ needs.build.outputs.digest }}
          APP_TARGET_TAGS: ${{ needs.build.outputs.tags }}
          MANAGER_SOURCE_IMAGE: ${{ needs.manager-build.outputs.candidate }}
          MANAGER_SOURCE_DIGEST: ${{ needs.manager-build.outputs.digest }}
          MANAGER_TARGET_TAGS: ${{ needs.manager-build.outputs.tags }}
        run: bash scripts/promote-image-pair.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, manager-build, promote]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release version
        id: release-version
        run: node scripts/release-version.mjs "${GITHUB_REF_NAME}"

      - name: Publish GitHub Release with cumulative notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release-version.outputs.version }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          MANAGER_IMAGE_DIGEST: ${{ needs.manager-build.outputs.digest }}
        run: |
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg revision "$GITHUB_SHA" \
            --arg image "${REGISTRY}/${IMAGE_NAME}" \
            --arg digest "$IMAGE_DIGEST" \
            --arg managerImage "${REGISTRY}/${MANAGER_IMAGE_NAME}" \
            --arg managerDigest "$MANAGER_IMAGE_DIGEST" \
            --arg publishedAt "$published_at" \
            '{schemaVersion: 1, version: $version, tag: $tag, revision: $revision, image: $image, digest: $digest, managerImage: $managerImage, managerDigest: $managerDigest, publishedAt: $publishedAt}' \
            > mergeron-release.json

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --title "Mergeron $VERSION"
          fi

          gh release upload "$GITHUB_REF_NAME" mergeron-release.json --clobber
