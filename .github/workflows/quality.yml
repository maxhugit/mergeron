name: Validate pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      validate_image:
        description: Build and validate the production image
        type: boolean
        default: true
  workflow_call:
    inputs:
      validate_image:
        description: Build an image in addition to source checks
        type: boolean
        default: false

concurrency:
  # A reusable invocation must not cancel source checks of an active publish.
  group: mergeron-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # Never let PRs overwrite the trusted main cache or another PR's cache.
  # Tags/manual branches use the immutable SHA, not an untrusted branch name.
  CACHE_SCOPE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref == 'refs/heads/main' && 'main' || github.sha }}

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        part: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          if [[ "${{ matrix.part }}" == backend ]]; then
            pnpm install --frozen-lockfile
            # Backend socket integration tests import the browser client types.
            pnpm --dir web install --frozen-lockfile
          else
            pnpm --dir web install --frozen-lockfile
          fi

      - name: Validate repository content
        if: matrix.part == 'backend'
        run: |
          python3 scripts/check-no-chinese.py
          python3 scripts/check-markdown-links.py
          pnpm check:release
          pnpm test:release
          node --test manager/test/*.test.mjs
          node --test runtime/*.test.cjs
          python3 -m unittest discover -s scripts -p 'test_*vex.py'
          python3 -m unittest discover -s scripts -p test_openssh_backport.py
          python3 -m unittest discover -s scripts -p test_libxml2_backport.py
          python3 -m unittest discover -s scripts -p test_mergeron_migration.py
          python3 -m unittest discover -s scripts -p test_authentik_ingress.py
          python3 -m unittest discover -s scripts -p test_project_archive.py
          python3 -m unittest discover -s scripts -p test_manager_deployment.py
          python3 -m unittest discover -s scripts -p test_update_dev_manager.py
          python3 -m unittest discover -s scripts -p test_configure_dev_browser.py
          node --test scripts/ci-workflows.test.mjs
          node --test scripts/visual-check.test.mjs
          node --test scripts/environment-check.test.mjs

      - name: Validate translation catalogs
        if: matrix.part == 'frontend'
        run: pnpm --dir web check:i18n

      - name: Install reviewed 7-Zip for archive tests
        if: matrix.part == 'backend'
        run: |
          version="$(sed -n 's/^ARG SEVENZIP_VERSION=//p' Dockerfile)"
          checksum="$(sed -n 's/^ARG SEVENZIP_LINUX_X64_SHA256=//p' Dockerfile)"
          bash scripts/install-sevenzip.sh "$version" "$checksum" "$RUNNER_TEMP/7zip"
          echo "$RUNNER_TEMP/7zip" >> "$GITHUB_PATH"

      - name: Lint
        run: |
          if [[ "${{ matrix.part }}" == backend ]]; then
            pnpm ensure:codex-schema
            pnpm exec eslint "{src,apps,libs}/**/*.ts" "codex_probe/**/*.ts"
          else
            pnpm --dir web lint
          fi

      - name: Test browser public-only egress policy
        if: matrix.part == 'backend'
        run: node --test deployment/browser/public-proxy.test.mjs

      - name: Test local browser extension with synthetic HTTPS pages
        if: matrix.part == 'backend'
        run: |
          node --test scripts/browser-extension-portability.test.mjs
          node node_modules/playwright-core/cli.js install --with-deps chromium webkit
          node scripts/test-local-browser-extension.mjs
          node scripts/test-local-browser-webkit.mjs

      - name: Test backend startup and migrations
        if: matrix.part == 'backend'
        run: >-
          pnpm exec vitest run
          src/app.controller.spec.ts
          src/database/database.service.spec.ts
          src/database/pending-request-migration.spec.ts
          src/database/project-locations-migration.spec.ts
          src/http-stack.spec.ts
          src/archive
          src/browser
          src/document-publication
          src/threads/project-connection-policy.service.spec.ts
          src/threads/project-connection-runtime.service.spec.ts
          src/threads/thread-history.service.spec.ts
          src/threads/threads.service.spec.ts
          src/settings/agent-instructions.service.spec.ts
          src/settings/settings.service.spec.ts
          src/codex/catalog/catalog-admission.service.spec.ts
          src/projects/project-workspace-layout.spec.ts
          src/projects/project-locations.service.spec.ts
          src/projects/project-location-selection.spec.ts
          src/projects/project-agent-creation.spec.ts
          src/projects/workspace-copies.service.spec.ts
          src/projects/workspace-git.service.spec.ts
          src/projects/workspace-git-limits.spec.ts
          src/projects/project-connection-tools.service.spec.ts
          src/threads/git-mutation-gate.service.spec.ts
          src/threads/agent-test-profile.spec.ts
          src/threads/agent-test-profile.controller.spec.ts
          src/threads/project-agent-defaults.service.spec.ts
          src/projects/workspace-git.controller.spec.ts
          src/projects/workspace-transfers.service.spec.ts
          src/active-folders
          src/projects/project-archives.spec.ts
          src/project-knowledge/project-knowledge.service.spec.ts
          src/project-knowledge/project-agent-tools.service.spec.ts
          src/internal-mcp
          src/simple-chat
          src/codex/codex-jsonrpc-client.spec.ts
          src/codex/cli/codex-cli.service.spec.ts
          src/codex/cli/cli-access.spec.ts
          src/project-knowledge/knowledge-proposals.service.spec.ts
          src/deliverables/deliverables.service.spec.ts
          src/deliverables/deliverables-agent.controller.spec.ts
          src/files/files.service.spec.ts
          src/auth/project-authorization.spec.ts
          src/auth/auth-config.service.spec.ts
          src/auth/local-auth.service.spec.ts
          src/previews
          src/auth/platform-cookie.spec.ts
          src/auth/impersonation.spec.ts
          src/auth/api-key.guard.spec.ts
          src/auth/platform-access.spec.ts
          src/auth/platform-access.http.spec.ts
          src/auth/platform-access.socket.spec.ts
          src/auth/project-socket-authorization.spec.ts

      - name: Test release-pair compensation
        if: matrix.part == 'backend'
        run: node --test scripts/promote-image-pair.test.mjs

      - name: Run frontend tests
        if: matrix.part == 'frontend'
        run: pnpm --dir web test

      - name: Test preview controls in Chromium and WebKit
        if: matrix.part == 'frontend'
        run: |
          pnpm --dir web exec node scripts/install-test-browsers.mjs --with-deps chromium webkit
          pnpm --dir web exec vitest run --project browser src/components/chat/agent-preview.browser.tsx

      - name: Test session recovery in Chromium and WebKit
        if: matrix.part == 'frontend'
        run: pnpm --dir web exec vitest run --project browser src/lib/platform-session.browser.tsx src/routes/authenticated-layout.browser.tsx

      - name: Test retained agent views in Chromium and WebKit
        if: matrix.part == 'frontend'
        run: >-
          pnpm --dir web exec vitest run --project browser
          src/components/chat/agent-workspace-cache.browser.tsx
          src/components/chat/virtual-transcript.browser.tsx
          src/components/chat/workspace-tree.browser.tsx
          src/components/files/file-actions-menu.browser.tsx

      - name: Preserve preview interface screenshots
        if: always() && matrix.part == 'frontend'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-ui-evidence-${{ github.sha }}
          path: web/.vitest-screenshots/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Build backend
        if: matrix.part == 'backend'
        run: pnpm build

      - name: Test built archive adapters with real 7-Zip
        if: matrix.part == 'backend'
        run: node scripts/smoke-test-archives.cjs

      - name: Test local administrator bootstrap on an isolated database
        if: matrix.part == 'backend'
        run: node scripts/smoke-test-local-bootstrap.cjs

      - name: Build frontend
        if: matrix.part == 'frontend'
        run: pnpm --dir web build

      - name: Check frontend bundle budgets
        if: matrix.part == 'frontend'
        run: pnpm --dir web check:bundle

  quality:
    needs: [checks, image, manager-image, browser-image, cli-runtime]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every source and image check
        env:
          SOURCE_RESULT: ${{ needs.checks.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          MANAGER_RESULT: ${{ needs.manager-image.result }}
          BROWSER_RESULT: ${{ needs.browser-image.result }}
          CLI_RESULT: ${{ needs.cli-runtime.result }}
          EXPECT_IMAGES: ${{ (github.event_name == 'pull_request' || inputs.validate_image == true) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          test "$SOURCE_RESULT" = success
          expected=skipped
          if [ "$EXPECT_IMAGES" = true ]; then expected=success; fi
          for result in "$IMAGE_RESULT" "$MANAGER_RESULT" "$BROWSER_RESULT" "$CLI_RESULT"; do
            test "$result" = "$expected" || exit 1
          done

  cli-runtime:
    needs: [image, manager-image]
    if: >-
      (github.event_name == 'pull_request' || inputs.validate_image == true) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Manager CLI installation, persistent protection and actual Linux sandbox
        env:
          APP: ghcr.io/maxhugit/mergeron@${{ needs.image.outputs.digest }}
          MANAGER: ghcr.io/maxhugit/mergeron-manager@${{ needs.manager-image.outputs.digest }}
          MERGERON_NETLINK_EVIDENCE: ${{ runner.temp }}/managed-cli-evidence
        run: |
          docker pull "$APP"
          docker pull "$MANAGER"
          mkdir "$MERGERON_NETLINK_EVIDENCE"
          chmod 777 "$MERGERON_NETLINK_EVIDENCE"
          bash scripts/smoke-test-managed-cli.sh "$APP" "$MANAGER"
      - name: Preserve isolated backend visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: managed-cli-evidence
          path: ${{ runner.temp }}/managed-cli-evidence/
          if-no-files-found: warn

  image:
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    # App, Manager and browser validate concurrently, without skipping any
    # security checks for UI/docs-only PRs. BuildKit reuses unchanged components.
    if: >-
      (github.event_name == 'pull_request' || inputs.validate_image == true) &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        id: app-builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate the production image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          load: true
          tags: ghcr.io/maxhugit/mergeron:quality-${{ github.sha }}
          cache-from: |
            type=registry,ref=ghcr.io/maxhugit/mergeron:buildcache-app-${{ env.CACHE_SCOPE }}
            type=registry,ref=ghcr.io/maxhugit/mergeron:buildcache-app-main
            type=registry,ref=ghcr.io/maxhugit/mergeron:buildcache
          cache-to: type=registry,ref=ghcr.io/maxhugit/mergeron:buildcache-app-${{ env.CACHE_SCOPE }},mode=max,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true

      - name: Name the loaded image for existing isolated checks
        run: docker tag "ghcr.io/maxhugit/mergeron:quality-${{ github.sha }}" "mergeron:quality-${{ github.sha }}"

      - name: Test real SSH and Git transfers against an isolated server
        env:
          IMAGE_REF: mergeron:quality-${{ github.sha }}
        run: |
          docker buildx build --platform linux/amd64 --file Dockerfile --target ssh-test-server --cache-from "type=registry,ref=ghcr.io/maxhugit/mergeron:buildcache-app-$CACHE_SCOPE" --cache-from type=registry,ref=ghcr.io/maxhugit/mergeron:buildcache-app-main --load --tag webui-ssh-fixture .
          scripts/smoke-test-ssh-image.sh "$IMAGE_REF" webui-ssh-fixture > ssh-client-evidence.json

      - name: Start the production image and wait for its health check
        run: scripts/smoke-test-image.sh "mergeron:quality-${{ github.sha }}"

      - name: Verify protected document execution on Linux
        run: bash scripts/smoke-test-document-isolation.sh "mergeron:quality-${{ github.sha }}"

      # The production image deliberately contains no Codex installation. Use
      # the build-only pinned dependency, never add the test CLI to that image.
      - name: Build the isolated native MCP test runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: backend-builder
          platforms: linux/amd64
          load: true
          push: false
          tags: mergeron:project-mcp-${{ github.sha }}
          cache-from: |
            type=registry,ref=ghcr.io/maxhugit/mergeron:buildcache-app-${{ env.CACHE_SCOPE }}
            type=registry,ref=ghcr.io/maxhugit/mergeron:buildcache-app-main

      - name: Verify project MCP policy on an existing native conversation
        run: bash scripts/smoke-test-project-mcp.sh "mergeron:project-mcp-${{ github.sha }}"

      - name: Verify filtered test profile in the actual Linux agent sandbox
        run: bash scripts/smoke-test-agent-profile.sh "mergeron:quality-${{ github.sha }}" "mergeron:project-mcp-${{ github.sha }}"

      - name: Release completed build fixtures before image scanning
        env:
          BUILDER_NAME: ${{ steps.app-builder.outputs.name }}
          MCP_IMAGE: mergeron:project-mcp-${{ github.sha }}
        run: |
          df -h /var/lib/docker
          df -i /var/lib/docker
          docker system df
          # Only this job's completed fixtures and isolated Buildx cache.
          # The registry cache has already been exported; keep the app image
          # for every remaining smoke test and vulnerability scan.
          docker image rm "$MCP_IMAGE" webui-ssh-fixture
          test -n "$BUILDER_NAME"
          docker buildx prune --builder "$BUILDER_NAME" --all --force
          df -h /var/lib/docker
          df -i /var/lib/docker

      - name: Scan production image dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: mergeron:quality-${{ github.sha }}
          format: json
          output: trivy-quality-results.raw.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'

      - name: Verify header package and native compilation
        run: scripts/verify-linux-headers-image.sh "mergeron:quality-${{ github.sha }}" > linux-header-evidence.json

      - name: Apply reviewed header applicability statements
        env:
          IMAGE_REF: mergeron:quality-${{ github.sha }}
        run: |
          trivy image --cache-dir .cache/trivy --skip-db-update --scanners vuln --severity HIGH,CRITICAL --vex security/linux-libc-dev.openvex.json --format json --output trivy-quality-results.headers.json "$IMAGE_REF"
          python3 scripts/audit-linux-header-vex.py trivy-quality-results.raw.json trivy-quality-results.headers.json security/linux-libc-dev.openvex.json

      - name: Verify absent system implementations and retained client features
        env:
          IMAGE_REF: mergeron:quality-${{ github.sha }}
        run: |
          scripts/verify-system-components-image.sh "$IMAGE_REF" > system-component-evidence.json
          python3 scripts/audit-system-component-vex.py prepare system-component-evidence.json image.openvex.json
          trivy image --cache-dir .cache/trivy --skip-db-update --scanners vuln --severity HIGH,CRITICAL --vex image.openvex.json --format json --output trivy-quality-results.json "$IMAGE_REF"
          python3 scripts/audit-system-component-vex.py audit system-component-evidence.json trivy-quality-results.headers.json trivy-quality-results.json

      - name: Require no HIGH or CRITICAL Node.js dependencies
        run: |
          jq -e 'any(.Results[]?; .Type == "node-pkg")' trivy-quality-results.json
          jq -r '.Results[]? | select(.Type == "node-pkg") | .Vulnerabilities[]? | [.Severity, .PkgName, .InstalledVersion, .VulnerabilityID, (.FixedVersion // "")] | @tsv' trivy-quality-results.json
          jq -e '[.Results[]? | select(.Type == "node-pkg") | .Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length == 0' trivy-quality-results.json

      - name: Require no HIGH or CRITICAL GitHub CLI dependencies
        run: |
          jq -e 'any(.Results[]?; .Type == "gobinary" and (.Target | ltrimstr("/")) == "usr/local/bin/gh")' trivy-quality-results.json
          jq -r '.Results[]? | select(.Type == "gobinary" and (.Target | ltrimstr("/")) == "usr/local/bin/gh") | .Vulnerabilities[]? | [.Severity, .PkgName, .InstalledVersion, .VulnerabilityID, (.FixedVersion // "")] | @tsv' trivy-quality-results.json
          jq -e '[.Results[]? | select(.Type == "gobinary" and (.Target | ltrimstr("/")) == "usr/local/bin/gh") | .Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length == 0' trivy-quality-results.json

      - name: Verify patched libxml2 and real Office conversions
        env:
          IMAGE_REF: mergeron:quality-${{ github.sha }}
        run: |
          scripts/smoke-test-office-image.sh "$IMAGE_REF" > office-xml-evidence.json
          python3 scripts/audit-libxml2-backport.py trivy-quality-results.raw.json office-xml-evidence.json

      - name: Verify corrected OpenSSH sources and retain raw scan findings
        run: python3 scripts/audit-openssh-backport.py trivy-quality-results.raw.json ssh-client-evidence.json

      - name: Validate both ingress authentication templates
        run: sh scripts/smoke-test-ingress.sh

      - name: Upload image security report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-quality-report-${{ github.sha }}
          path: |
            trivy-quality-results.json
            trivy-quality-results.raw.json
            trivy-quality-results.headers.json
            office-xml-evidence.json
            security/libxml2-patches/manifest.json
            ssh-client-evidence.json
            system-component-evidence.json
            image.openvex.json
            security/system-components.openvex.json
            security/system-components-assessment.json
            linux-header-evidence.json
            security/linux-libc-dev.openvex.json
            security/linux-libc-dev-assessment.csv
          if-no-files-found: warn
          retention-days: 30

  manager-image:
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    if: >-
      (github.event_name == 'pull_request' || inputs.validate_image == true) &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the minimal Manager image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.manager
          platforms: linux/amd64
          push: true
          load: true
          tags: ghcr.io/maxhugit/mergeron-manager:quality-${{ github.sha }}
          cache-from: |
            type=registry,ref=ghcr.io/maxhugit/mergeron-manager:buildcache-manager-${{ env.CACHE_SCOPE }}
            type=registry,ref=ghcr.io/maxhugit/mergeron-manager:buildcache-manager-main
          cache-to: type=registry,ref=ghcr.io/maxhugit/mergeron-manager:buildcache-manager-${{ env.CACHE_SCOPE }},mode=max,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true

      - name: Name the loaded Manager image for existing isolated checks
        run: docker tag "ghcr.io/maxhugit/mergeron-manager:quality-${{ github.sha }}" "mergeron-manager:quality-${{ github.sha }}"

      - name: Validate generic agent previews on the isolated runner
        run: bash scripts/smoke-test-agent-previews.sh "mergeron-manager:quality-${{ github.sha }}"

      - name: Start Manager and verify its Unix socket health check
        env:
          IMAGE_REF: mergeron-manager:quality-${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/mergeron-manager-run" "$RUNNER_TEMP/mergeron-manager-state"
          sudo chown 0:0 "$RUNNER_TEMP/mergeron-manager-run" "$RUNNER_TEMP/mergeron-manager-state"
          bash scripts/smoke-test-manager-secrets.sh "$IMAGE_REF"
          bash scripts/smoke-test-manager-backup.sh "$IMAGE_REF"
          bash scripts/smoke-test-manager-browser.sh "$IMAGE_REF"
          container_id="$(docker run -d --read-only --network none --cap-drop ALL --cap-add CHOWN --cap-add DAC_READ_SEARCH --security-opt no-new-privileges:true --tmpfs /tmp:rw,nosuid,nodev,size=8m -v /var/run/docker.sock:/var/run/docker.sock:ro -v "$RUNNER_TEMP/mergeron-manager-run:/run/mergeron-manager" -v "$RUNNER_TEMP/mergeron-manager-state:/var/lib/mergeron-manager" "$IMAGE_REF")"
          trap 'docker logs "$container_id"; docker rm -f "$container_id" >/dev/null' EXIT
          for attempt in $(seq 1 20); do
            if docker exec "$container_id" /nodejs/bin/node src/healthcheck.mjs; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Require no HIGH or CRITICAL Manager vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: mergeron-manager:quality-${{ github.sha }}
          format: json
          output: trivy-manager-results.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: Upload Manager security report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-manager-report-${{ github.sha }}
          path: trivy-manager-results.json
          if-no-files-found: warn
          retention-days: 30

  browser-image:
    if: >-
      (github.event_name == 'pull_request' || inputs.validate_image == true) &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the browser runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./deployment/browser
          platforms: linux/amd64
          push: false
          load: true
          tags: mergeron-browser:quality-${{ github.sha }}
          cache-from: |
            type=registry,ref=ghcr.io/maxhugit/mergeron-browser:buildcache-browser-${{ env.CACHE_SCOPE }}
            type=registry,ref=ghcr.io/maxhugit/mergeron-browser:buildcache-browser-main
          cache-to: type=registry,ref=ghcr.io/maxhugit/mergeron-browser:buildcache-browser-${{ env.CACHE_SCOPE }},mode=max,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true

      - name: Verify browser runtime and absence of build package managers
        run: bash scripts/smoke-test-browser-image.sh "mergeron-browser:quality-${{ github.sha }}"

      - name: Require no HIGH or CRITICAL browser vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: mergeron-browser:quality-${{ github.sha }}
          format: json
          output: trivy-browser-results.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: Upload browser security report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-browser-report-${{ github.sha }}
          path: trivy-browser-results.json
          if-no-files-found: warn
          retention-days: 30
